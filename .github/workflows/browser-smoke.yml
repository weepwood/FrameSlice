name: Chrome 真实浏览器 Worker 冒烟测试

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: frameslice-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装固定版本项目依赖
        run: npm ci --no-audit --no-fund
      - name: 安装字幕工作台依赖（Whisper / FFmpeg / React）
        run: |
          npm install -g npm@11.21.1
          npm --prefix apps/caption-studio ci --ignore-scripts --no-audit --no-fund
      - name: 两个工作区依赖审计与单元测试
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix apps/caption-studio audit --omit=dev --audit-level=high
          npm test
      - name: 测试浏览器依赖（不修改 lockfile）
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright-core@1.55.0
      - name: 设置 Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-dependencies: true
      - name: 安装中文视觉回归字体
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-match 'Noto Sans CJK SC'
      - name: 构建与启动预览
        id: preview
        run: |
          npm run build
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/frameslice-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/FrameSlice/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/frameslice-vite.log
          exit 1
      - name: 验证 Worker、真实 OPFS 目录句柄、MP4 分割与 JPEG 抽帧
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          APP_URL: http://127.0.0.1:4173/FrameSlice/
        run: |
          node scripts/browser-smoke.mjs
          node scripts/browser-resume.mjs
          node scripts/browser-batch-resume.mjs
          node scripts/browser-history.mjs
          node scripts/browser-caption-recovery.mjs
          node scripts/browser-caption-conflict.mjs
      - name: 独立固定视口视觉候选
        if: always() && steps.preview.outcome == 'success'
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          APP_URL: http://127.0.0.1:4173/FrameSlice/
        run: node scripts/browser-visual-candidate.mjs
      - name: 审核基线像素差异门禁
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test ! -f visual-baseline/approval.json; then echo '候选阶段，尚无人工批准基线'; exit 0; fi
          sudo apt-get install -y python3-pil
          bash scripts/fetch-approved-visual.sh /tmp/frameslice-approved
          python3 scripts/verify-approved-visual.py /tmp/frameslice-approved visual-candidate
          python3 scripts/compare-visual.py /tmp/frameslice-approved visual-candidate --output visual-diff --threshold 0.02
      - name: 短样本真实浏览器性能基准
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          APP_URL: http://127.0.0.1:4173/FrameSlice/
          STRESS_MIN_BYTES: '1'
        run: |
          base64 -d tests/fixtures/black-h264-aac.mp4.b64 >/tmp/frameslice-benchmark.mp4
          node scripts/browser-stress-real.mjs /tmp/frameslice-benchmark.mp4 browser-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-regression-${{ github.run_attempt }}
          path: |
            visual-regression/
            visual-candidate/
            visual-diff/
            browser-benchmark.json
          if-no-files-found: warn
