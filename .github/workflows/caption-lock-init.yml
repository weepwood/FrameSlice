name: 一次性锁定字幕工作台依赖
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/caption-lock-init.yml'
permissions:
  contents: write
jobs:
  lock-caption-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 配置 npm 11
        run: npm install -g npm@11.21.1
      - name: 固定字幕依赖树，不运行安装脚本
        run: npm --prefix apps/caption-studio install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: 提交字幕依赖锁文件
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/caption-studio/package-lock.json
          git commit -m '锁定 Caption-Studio 独立依赖版本'
          git push origin HEAD:main
