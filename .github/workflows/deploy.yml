name: 发布 FrameSlice 到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: frameslice-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装依赖
        run: npm ci --no-audit --no-fund
      - name: 安装字幕工作台依赖（Whisper / FFmpeg / React）
        run: |
          npm install -g npm@11.21.1
          npm --prefix apps/caption-studio install --ignore-scripts --no-audit --no-fund
      - name: 扫描生产依赖安全公告
        run: npm audit --omit=dev --audit-level=high
      - name: 单元测试与正式构建
        run: |
          npm test
          npm run build
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 上传静态站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
