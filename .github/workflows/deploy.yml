name: 发布 FrameSlice 到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: frameslice-pages
  cancel-in-progress: true

jobs:
  browser-gate:
    uses: ./.github/workflows/browser-smoke.yml
    permissions:
      contents: read
      actions: read
  build-and-deploy:
    needs: browser-gate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry-deployment.outputs.page_url }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装依赖
        run: npm ci --no-audit --no-fund
      - name: 安装字幕工作台依赖（Whisper / FFmpeg / React）
        run: |
          npm install -g npm@11.21.1
          npm --prefix apps/caption-studio ci --ignore-scripts --no-audit --no-fund
      - name: 扫描生产依赖安全公告
        run: npm audit --omit=dev --audit-level=high
      - name: 单元测试与正式构建
        run: |
          npm test
          npm run build
      - name: 正式版本必须具备人工审核基线
        run: |
          test -s visual-baseline/approval.json
          test "$(jq -r .releaseTag visual-baseline/approval.json)" = "v$(node -p 'require("./package.json").version')"
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 写入生产版本标识
        run: node -e 'require("fs").writeFileSync("dist/frameslice-version.json",JSON.stringify({version:require("./package.json").version,sha:process.env.GITHUB_SHA}))'
      - name: 上传静态站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}
      - name: 等待 Pages 产物在 Actions API 可见
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" | jq -e --arg name "github-pages-$GITHUB_RUN_ATTEMPT" '[.artifacts[] | select(.name == $name and .expired == false)] | length == 1' >/dev/null; then sleep 15; exit 0; fi
            sleep 5
          done
          echo 'Pages artifact not visible after upload' >&2
          exit 1
      - name: 发布到 GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: 产物发现失败后的有限重试等待
        if: steps.deployment.outcome == 'failure'
        run: sleep 25
      - name: 重试 Pages 发布
        id: retry-deployment
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: 验证实际线上版本与提交
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url || steps.retry-deployment.outputs.page_url }}
        run: |
          set -e
          BASE=${PAGE_URL:-https://weepwood.github.io/FrameSlice/}
          for attempt in $(seq 1 20); do
            if curl -fsSL --max-time 15 "${BASE%/}/frameslice-version.json?sha=$GITHUB_SHA" | jq -e --arg sha "$GITHUB_SHA" --arg version "$(node -p 'require("./package.json").version')" '.sha == $sha and .version == $version' >/dev/null; then exit 0; fi
            sleep 6
          done
          echo 'Production version marker did not match deployed commit' >&2
          exit 1

  release-version:
    if: github.ref == 'refs/heads/main'
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: 发布已验收版本
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in 0.7.1|0.8.0|0.9.0) ;; *) exit 0 ;; esac
          set -euo pipefail
          node -e 'const v=require("./package.json").version; for(const p of ["./package-lock.json","./apps/caption-studio/package.json","./apps/caption-studio/package-lock.json"]){const x=require(p);if(x.version!==v||(x.packages&&x.packages[""].version!==v))throw Error("版本不一致 "+p)}'
          awk -v heading="## v$VERSION" '$0==heading{p=1;next} /^## /{if(p)exit} p' CHANGELOG.md > /tmp/frameslice-release-notes.md
          test -s /tmp/frameslice-release-notes.md
          test -s visual-baseline/approval.json
          test "$(jq -r .releaseTag visual-baseline/approval.json)" = "v$VERSION"
          bash scripts/fetch-approved-visual.sh /tmp/frameslice-approved
          python3 scripts/verify-approved-visual.py /tmp/frameslice-approved
          ASSET=$(python3 -c 'import json; a=json.load(open("visual-baseline/approval.json")); print(a.get("assetName","visual-baseline-"+a["releaseTag"]+".zip"))')
          [[ "$ASSET" =~ ^visual-baseline-[a-zA-Z0-9._-]+\.zip$ ]]
          python3 - "$ASSET" <<'PY'
          import pathlib, zipfile, sys
          p=pathlib.Path("/tmp/frameslice-approved")
          with zipfile.ZipFile("/tmp/"+sys.argv[1],"w",zipfile.ZIP_DEFLATED) as z:
              for f in sorted(p.glob("*.png")): z.write(f,f.name)
              z.write("visual-baseline/approval.json","approval.json")
          PY
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if test "$(gh release view "v$VERSION" --json isDraft --jq .isDraft)" = false; then
              # Preserve the original release asset. Archive a reviewed UI revision separately, never clobber.
              gh release view "v$VERSION" --json assets --jq '.assets[].name' | grep -Fx "visual-baseline-v$VERSION.zip"
              if ! gh release view "v$VERSION" --json assets --jq '.assets[].name' | grep -Fx "$ASSET"; then
                gh release upload "v$VERSION" "/tmp/$ASSET"
              fi
              gh release download "v$VERSION" --pattern "$ASSET" --dir /tmp/frameslice-release-check
              mkdir -p /tmp/frameslice-release-images
              python3 - "$ASSET" <<'PY'
          import pathlib, zipfile, sys
          with zipfile.ZipFile("/tmp/frameslice-release-check/"+sys.argv[1]) as z:
              for n in z.namelist():
                  if n.endswith(".png") and pathlib.Path(n).name == n:
                      pathlib.Path("/tmp/frameslice-release-images",n).write_bytes(z.read(n))
          PY
              python3 scripts/verify-approved-visual.py /tmp/frameslice-release-images
              exit 0
            fi
          else
            gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "FrameSlice v$VERSION" --notes-file /tmp/frameslice-release-notes.md --draft
          fi
          if ! gh release view "v$VERSION" --json assets --jq '.assets[].name' | grep -Fx "$ASSET"; then
            gh release upload "v$VERSION" "/tmp/$ASSET"
          fi
          gh release download "v$VERSION" --pattern "$ASSET" --dir /tmp/frameslice-new-release-check
          mkdir -p /tmp/frameslice-new-release-images
          python3 - "$ASSET" <<'PY'
          import pathlib, zipfile, sys
          with zipfile.ZipFile("/tmp/frameslice-new-release-check/"+sys.argv[1]) as z:
              for n in z.namelist():
                  if n.endswith(".png") and pathlib.Path(n).name == n:
                      pathlib.Path("/tmp/frameslice-new-release-images",n).write_bytes(z.read(n))
          PY
          python3 scripts/verify-approved-visual.py /tmp/frameslice-new-release-images
          gh release edit "v$VERSION" --draft=false
          if test "$VERSION" = "0.8.0" || test "$VERSION" = "0.9.0"; then
            test "$(git ls-remote origin "refs/tags/v$VERSION" | cut -f1)" = "$GITHUB_SHA"
          fi
          gh release view "v$VERSION" --json tagName,isDraft,assets | jq -e --arg asset "$ASSET" --arg tag "v$VERSION" '.tagName==$tag and .isDraft==false and any(.assets[];.name==$asset)'
